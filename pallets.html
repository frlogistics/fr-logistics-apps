<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B2545">
<title>Pallets — FR-Logistics</title>
<!--
  Pallets — standalone module.

  Replaces the Pallets section of fr-mobile.html, which talked DIRECTLY to
  Supabase with the anon key hard-coded in the page. That key was readable by
  anyone with "view source", and the pallets / pallet_packages tables carried a
  FOR ALL TO public policy plus DELETE and TRUNCATE grants to anon. Every write
  now goes through frm-pallets.js on the service key; nothing sensitive ships
  to the browser.

  Session is shared with FR Mobile via localStorage (frm_op / frm_ok).
-->
<style>
  :root{
    --navy:#0B2545; --teal:#1C7293; --amber:#F4A261; --red:#B4232C; --green:#15803D;
    --line:#E2E8F0; --bg:#F1F5F9; --muted:#64748B; --ink:#0F172A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       color:var(--ink);background:var(--bg);padding-bottom:40px}

  .top{background:var(--navy);color:#fff;padding:13px 16px;display:flex;
       align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  .top h1{font-size:17px;margin:0;font-weight:600;flex:1}
  .top a.back{color:#fff;text-decoration:none;font-size:20px;line-height:1;opacity:.85}
  .who{background:rgba(255,255,255,.15);border-radius:14px;padding:4px 11px;font-size:12px}

  main{max-width:640px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .card h2{margin:0 0 12px;font-size:15px;font-weight:600}

  .field{margin-bottom:12px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
        color:var(--muted);margin-bottom:5px;font-weight:600}
  input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;
               font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--teal);outline-offset:-1px}

  .btn{display:block;width:100%;padding:13px;border:0;border-radius:8px;background:var(--navy);
       color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  .btn.go{background:var(--teal)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.amber{background:var(--amber);color:var(--navy)}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:9px}
  .row .btn{flex:1}

  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
  ul.list li:last-child{border-bottom:0}
  .l1{font-weight:600;font-size:14px;word-break:break-all}
  .l2{font-size:12px;color:var(--muted)}
  .qty{font-weight:700;font-size:17px;color:var(--navy);white-space:nowrap}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:14px 0}
  .code{font-family:Consolas,monospace;font-size:13px;word-break:break-all;flex:1}
  .badge{font-size:11px;color:var(--muted);white-space:nowrap}

  .hero{background:var(--navy);color:#fff;border-radius:10px;padding:14px;margin-bottom:12px;
        display:flex;align-items:center;gap:12px}
  .hero .ref{font-size:15px;font-weight:600;font-family:Consolas,monospace;word-break:break-all}
  .hero .sub{font-size:12px;color:#B9CCE0;margin-top:2px}
  .hero .big{margin-left:auto;font-size:26px;font-weight:700;line-height:1}
  .hero .biglbl{font-size:10px;color:#B9CCE0;text-transform:uppercase;text-align:right}

  .scanpad{background:#fff;border:2px dashed var(--line);border-radius:10px;padding:22px 14px;
           text-align:center;margin-bottom:12px;cursor:text}
  .scanpad.ok{border-color:var(--green);background:#F0FDF4}
  .scanpad.err{border-color:var(--red);background:#FEF2F2}
  .scanpad.dup{border-color:var(--amber);background:#FFF7ED}
  .scanpad .icon{font-size:26px;line-height:1}
  .scanpad .big{font-size:17px;font-weight:600;margin-top:7px}
  .scanpad .c{font-family:Consolas,monospace;font-size:13px;color:var(--muted);margin-top:5px;word-break:break-all}
  .scanpad .hint{font-size:12px;color:var(--muted);margin-top:6px}
  #cap{position:absolute;left:-9999px;opacity:0;height:1px;width:1px}

  .pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
  .pill.OPEN{background:#DCFCE7;color:#166534}
  .pill.FULL{background:#FEF3C7;color:#92400E}
  .pill.WRAPPED{background:#DBEAFE;color:#1E40AF}
  .undo{background:none;border:0;color:var(--muted);font-size:18px;padding:0 5px;cursor:pointer}

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(90px);
         background:var(--navy);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;
         max-width:88vw;text-align:center;transition:transform .22s;z-index:60;pointer-events:none}
  #toast.up{transform:translateX(-50%) translateY(0)}
  [hidden]{display:none !important}
</style>
</head>
<body>

<div class="top">
  <a class="back" href="/fr-mobile.html" title="Back">‹</a>
  <h1>Pallets</h1>
  <span class="who" id="who" hidden></span>
</div>

<main>
  <section id="vGate">
    <div class="card">
      <h2>Who is building?</h2>
      <div class="field">
        <label for="opname">Your name</label>
        <input id="opname" type="text" placeholder="e.g. Joe Raymond" autocomplete="name">
      </div>
      <button class="btn go" id="gateBtn">Start</button>
    </div>
  </section>

  <section id="vHome" hidden>
    <div class="card">
      <h2>New pallet</h2>
      <div class="field">
        <label for="pClient">Client</label>
        <select id="pClient"><option value="">— Select client —</option></select>
      </div>
      <div class="field">
        <label for="pSize">Pallet size</label>
        <select id="pSize">
          <option value="48x40">48 × 40</option>
          <option value="48x48">48 × 48</option>
          <option value="42x42">42 × 42</option>
          <option value="Custom">Custom</option>
        </select>
      </div>
      <button class="btn go" id="createBtn">+ Create pallet</button>
    </div>

    <div class="card">
      <h2>Open pallets</h2>
      <ul class="list" id="openList"></ul>
      <div class="empty" id="openEmpty">Loading…</div>
    </div>
  </section>

  <section id="vPallet" hidden>
    <div class="hero">
      <div style="min-width:0">
        <div class="ref" id="hId">—</div>
        <div class="sub" id="hSub">—</div>
      </div>
      <div>
        <div class="big" id="hCount">0</div>
        <div class="biglbl">packages</div>
      </div>
    </div>

    <div class="scanpad" id="pad">
      <div class="icon" id="padIcon">▣</div>
      <div class="big" id="padBig">Scan package tracking</div>
      <div class="c" id="padCode"></div>
      <div class="hint" id="padHint">Pull the trigger on the carrier label.</div>
    </div>
    <input id="cap" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

    <div class="card">
      <h2>Packages</h2>
      <ul class="list" id="pkgList"></ul>
      <div class="empty" id="pkgEmpty">No packages yet.</div>
    </div>

    <div class="card">
      <h2>Status</h2>
      <div class="row" style="margin-bottom:9px">
        <button class="btn amber" id="fullBtn">Mark FULL</button>
        <button class="btn go" id="wrapBtn">Wrapped / ready</button>
      </div>
      <div class="l2" id="statusHint">A pallet must have packages before it can be closed.</div>
    </div>

    <button class="btn ghost" id="backBtn">← All pallets</button>
  </section>
</main>

<div id="toast"></div>

<script>
"use strict";
(function(){

const API = 'https://apps.fr-logistics.net/.netlify/functions';
const $   = (id) => document.getElementById(id);
const WRAPPED = 'WRAPPED / READY FOR PICKUP';

const S = { operator:null, clients:[] };
const P = { current:null, busy:false };

/* ── plumbing ──────────────────────────────────────────────────────── */

function toast(msg, ms){
  const t = $('toast');
  t.textContent = msg; t.classList.add('up');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('up'), ms || 2600);
}

/** Text first, then parse — an HTML error page must not become a parse error. */
async function api(method, action, data){
  const url = method === 'GET'
    ? API + '/frm-pallets?action=' + encodeURIComponent(action) + '&' + new URLSearchParams(data || {})
    : API + '/frm-pallets';
  let r;
  try{
    r = await fetch(url, method === 'GET' ? {} : {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action, ...(data || {}) })
    });
  }catch(netErr){
    throw new Error('No connection');
  }
  const text = await r.text();
  let j = {};
  try { j = text ? JSON.parse(text) : {}; }
  catch { throw new Error('Server error (HTTP ' + r.status + ')'); }
  if(!r.ok || j.ok === false) throw Object.assign(new Error(j.message || j.error || ('HTTP ' + r.status)), {payload:j});
  return j;
}

function feedback(kind){
  try{ if(navigator.vibrate) navigator.vibrate(kind === 'ok' ? 40 : kind === 'err' ? [60,50,60] : 25); }catch(_){}
}
function show(v){ ['vGate','vHome','vPallet'].forEach(x => { $(x).hidden = (x !== v); }); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function timeAgo(d){
  const m = Math.floor((Date.now() - d.getTime()) / 60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if(h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

/* ── sign in ───────────────────────────────────────────────────────── */

function signIn(name){
  const op = String(name || '').trim();
  if(!op){ toast('Type your name'); return; }
  S.operator = op;
  localStorage.setItem('frm_op', op);
  localStorage.setItem('frm_ok', '1');
  $('who').textContent = op; $('who').hidden = false;
  goHome();
}

/* ── clients ───────────────────────────────────────────────────────── */

async function loadClients(){
  try{
    const r = await fetch(API + '/clients-list');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const rows = Array.isArray(data) ? data : (data.clients || data.data || []);
    const list = rows
      .filter(c => c.active !== false && c.type !== 'Internal' && (c.status || '') !== 'Internal')
      .map(c => ({ label:(c.company && c.company.trim()) || c.name }))
      .filter(c => c.label)
      .sort((a,b) => a.label.localeCompare(b.label));
    const seen = new Set();
    S.clients = list.filter(c => {
      const k = c.label.toLowerCase();
      if(seen.has(k)) return false;
      seen.add(k); return true;
    });
    // The pallets table stores the client as text, not an id — keep it that way
    // so the 16 existing pallets stay readable.
    $('pClient').innerHTML = '<option value="">— Select client —</option>' +
      S.clients.map(c => `<option value="${esc(c.label)}">${esc(c.label)}</option>`).join('');
  }catch(e){ toast('Could not load clients'); }
}

/* ── home ──────────────────────────────────────────────────────────── */

function goHome(){
  P.current = null;
  show('vHome');
  refreshOpenPallets();
}

async function refreshOpenPallets(){
  const ul = $('openList'), empty = $('openEmpty');
  ul.innerHTML = ''; empty.style.display = 'block'; empty.textContent = 'Loading…';
  try{
    const j = await api('GET', 'open');
    const rows = j.pallets || [];
    if(!rows.length){ empty.textContent = 'No open pallets.'; return; }
    empty.style.display = 'none';
    rows.forEach(r => {
      const li = document.createElement('li');
      li.style.cursor = 'pointer';
      li.innerHTML = `<div style="flex:1;min-width:0">
          <div class="l1">${esc(r.pallet_id)}</div>
          <div class="l2">${esc(r.client || '—')} · ${esc(r.pallet_size || '—')}</div>
        </div><span class="qty">${r.count}</span>`;
      li.onclick = () => openPallet(r.pallet_id);
      ul.appendChild(li);
    });
  }catch(e){ empty.textContent = 'Could not load pallets: ' + e.message; }
}

async function createPallet(){
  const client = $('pClient').value.trim();
  if(!client){ toast('Pick a client first'); return; }
  const btn = $('createBtn'); btn.disabled = true;
  try{
    const j = await api('POST', 'create', { client, pallet_size:$('pSize').value });
    P.current = j.pallet;
    show('vPallet'); render();
    setTimeout(focusCap, 80);
    toast('Pallet created');
  }catch(e){ toast('Could not create: ' + e.message); }
  finally{ btn.disabled = false; }
}

/* ── active pallet ─────────────────────────────────────────────────── */

async function openPallet(palletId){
  try{
    const j = await api('GET', 'pallet', { pallet_id:palletId });
    P.current = j.pallet;
    show('vPallet'); render();
    setPad('', 'Scan package tracking', '', '');
    setTimeout(focusCap, 80);
  }catch(e){ toast('Could not open: ' + e.message); }
}

function render(){
  const p = P.current; if(!p) return;
  const pkgs = p.packages || [];
  const status = p.status || 'OPEN';

  $('hId').textContent = p.pallet_id;
  $('hSub').textContent = `${p.client || '—'} · ${p.pallet_size || '—'} · ${status}`;
  $('hCount').textContent = pkgs.length;

  const ul = $('pkgList'), empty = $('pkgEmpty');
  empty.style.display = pkgs.length ? 'none' : 'block';
  ul.innerHTML = '';
  // Newest first, capped: a 400-package pallet must not render 400 rows on a phone.
  pkgs.slice().reverse().slice(0, 60).forEach(pk => {
    const li = document.createElement('li');
    const when = pk.addedAt ? timeAgo(new Date(pk.addedAt)) : '';
    li.innerHTML = `<span class="code">${esc(pk.tracking)}</span><span class="badge">${esc(when)}</span>`;
    if(status !== WRAPPED){
      const b = document.createElement('button');
      b.className = 'undo'; b.textContent = '↺'; b.title = 'Remove';
      b.onclick = () => removePackage(pk.tracking);
      li.appendChild(b);
    }
    ul.appendChild(li);
  });
  if(pkgs.length > 60){
    const li = document.createElement('li');
    li.innerHTML = `<span class="l2">…and ${pkgs.length - 60} more</span>`;
    ul.appendChild(li);
  }

  const wrapped = (status === WRAPPED);
  const empty0 = !pkgs.length;
  $('fullBtn').disabled = wrapped || empty0;
  $('wrapBtn').disabled = wrapped || empty0;
  $('statusHint').textContent = wrapped
    ? 'This pallet is wrapped and ready for pickup. It can no longer be edited.'
    : empty0 ? 'A pallet must have packages before it can be closed.'
    : status === 'FULL' ? 'Marked FULL. Wrap it when it goes out.'
    : 'Scan packages, then mark FULL or wrapped.';
}

/* ── scanning ──────────────────────────────────────────────────────── */

function focusCap(){ const c = $('cap'); if(c && !$('vPallet').hidden) c.focus(); }

function setPad(kind, big, hint, code){
  const p = $('pad');
  p.className = 'scanpad' + (kind ? ' ' + kind : '');
  $('padIcon').textContent = kind === 'ok' ? '✓' : kind === 'dup' ? '!' : kind === 'err' ? '✕' : '▣';
  $('padBig').textContent = big;
  $('padHint').textContent = hint || 'Pull the trigger on the carrier label.';
  $('padCode').textContent = code || '';
  if(kind === 'ok' || kind === 'dup'){
    clearTimeout(setPad._t);
    setPad._t = setTimeout(() => setPad('', 'Scan package tracking', '', ''), 1500);
  }
}

async function onScan(raw){
  const code = String(raw || '').trim().toUpperCase();
  if(!code || P.busy) return;
  if(!P.current){ setPad('err','No active pallet','Open a pallet first',code); feedback('err'); return; }
  if(/^FRP-/.test(code)){
    setPad('err','That is a Pallet ID','Scan the carrier label instead',code); feedback('err'); return;
  }
  if((P.current.packages || []).some(x => x.tracking === code)){
    setPad('dup','Already on this pallet','',code); feedback('dup'); return;
  }

  P.busy = true;
  setPad('', 'Checking…', '', code);
  try{
    const j = await api('POST', 'add_package', { pallet_id:P.current.pallet_id, tracking:code });
    P.current = j.pallet;
    render();
    setPad('ok', 'Added', j.count + ' on this pallet', code);
    feedback('ok');
  }catch(e){
    const pl = e.payload || {};
    if(pl.error === 'ON_ANOTHER_PALLET'){
      setPad('dup','On another pallet', pl.pallet_id, code); feedback('dup');
      toast('Already on ' + pl.pallet_id, 3500);
    }else if(pl.error === 'ALREADY_HERE'){
      setPad('dup','Already on this pallet','',code); feedback('dup');
    }else{
      setPad('err','Not added', e.message, code); feedback('err');
    }
  }finally{
    P.busy = false;
    setTimeout(focusCap, 80);
  }
}

async function removePackage(trk){
  if(!P.current || P.busy) return;
  if(!confirm('Remove ' + trk + ' from this pallet?')) return;
  P.busy = true;
  try{
    const j = await api('POST', 'remove_package', { pallet_id:P.current.pallet_id, tracking:trk });
    P.current = j.pallet;
    render();
    toast('Removed ' + trk.slice(-8));
  }catch(e){ toast('Could not remove: ' + e.message); }
  finally{ P.busy = false; setTimeout(focusCap, 60); }
}

async function setStatus(status, label){
  if(!P.current) return;
  if(!confirm(label + ' — ' + P.current.pallet_id + '?')) return;
  try{
    const j = await api('POST', 'set_status', { pallet_id:P.current.pallet_id, status });
    P.current = j.pallet;
    render();
    toast('Status: ' + (j.pallet.status || status));
  }catch(e){ toast('Could not update: ' + e.message); }
}

/* ── wiring ────────────────────────────────────────────────────────── */

$('gateBtn').onclick  = () => signIn($('opname').value);
$('opname').onkeydown = (e) => { if(e.key === 'Enter') signIn($('opname').value); };
$('createBtn').onclick = createPallet;
$('backBtn').onclick   = goHome;
$('pad').onclick       = focusCap;
$('fullBtn').onclick   = () => setStatus('FULL', 'Mark FULL');
$('wrapBtn').onclick   = () => setStatus('WRAPPED', 'Mark wrapped and ready for pickup');

$('cap').addEventListener('keydown', (e) => {
  if(e.key !== 'Enter') return;
  e.preventDefault();
  const v = $('cap').value;
  $('cap').value = '';
  onScan(v);
});
document.addEventListener('click', (e) => {
  if($('vPallet').hidden) return;
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'BUTTON')) return;
  setTimeout(focusCap, 40);
});

/* ── boot ──────────────────────────────────────────────────────────── */

loadClients();
const saved = localStorage.getItem('frm_op');
if(saved) $('opname').value = saved;
if(saved && localStorage.getItem('frm_ok') === '1'){
  S.operator = saved;
  $('who').textContent = saved; $('who').hidden = false;
  goHome();
}else{
  show('vGate');
}

})();
</script>
</body>
</html>
